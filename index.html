<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Book</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="navbar">
        <h1>D Books</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h2>Elon Musk</h2>
            <h5>Ashlee Vance</h5>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nulla reprehenderit consequuntur eligendi, quidem sapiente eaque quod sunt error dolorem dolore officiis. Quibusdam nostrum modi ducimus eveniet! Provident officia adipisci eveniet.</p>
            <button onclick="deletei()">Delete</button>
            
        </div>
    </div>
    <div class="popup-overlay"></div>
    <button class="add-btn" id="add-popup-btn">+</button>
    <div class="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title">
            <input type="text" placeholder="Book Author" id="book-author">
            <textarea placeholder="short description" id="book-description"></textarea>
            <button id="add-book">add</button>
            <button id="cancel-book">cancel</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
